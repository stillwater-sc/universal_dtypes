name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned deliberately: an unpinned ruff release can retroactively fail
      # open PRs for reasons unrelated to the change under review.
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.10" }
          - { os: ubuntu-22.04, python: "3.12" }
          # macOS 14 images are retired on 2026-11-02 (actions/runner-images#13518).
          - { os: macos-15, python: "3.12" }
          - { os: windows-2022, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # GCC 12, the minimum (README), not ubuntu-22.04's default GCC 11.4:
      # Universal 5.13 and later use constexpr std::vector, which GCC 11's
      # libstdc++ lacks.
      - name: Use GCC 12 (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v g++-12 || { sudo apt-get update && sudo apt-get install -y g++-12; }
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
      - name: Install package
        run: pip install ".[dev]" -v
      - name: Run tests
        run: pytest -v
