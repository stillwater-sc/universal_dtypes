[build-system]
# The bfloat16 dtype uses the NEP-42 DType API (PyArrayInitDTypeMeta_FromSpec,
# ArrayMethod casts + ufunc loops), which is NumPy 2.x only. Build and runtime
# both require numpy>=2.
requires = ["scikit-build-core>=0.10", "nanobind>=2.0", "numpy>=2"]
build-backend = "scikit_build_core.build"

[project]
name = "universal_dtypes"
version = "0.9.0"
description = "NumPy dtypes for the Stillwater Universal number systems (posit, cfloat, fixpnt, lns)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Stillwater Supercomputing, Inc." }]
dependencies = ["numpy>=2"]  # NEP-42 DType API requires NumPy 2.x

[project.urls]
Homepage = "https://github.com/stillwater-sc/universal_dtypes"
Repository = "https://github.com/stillwater-sc/universal_dtypes"
Universal = "https://github.com/stillwater-sc/universal"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pytest>=7.0", "numpy>=2", "ml_dtypes"]

[tool.scikit-build]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

# ---------------------------------------------------------------------------
# python-semantic-release
#
# universal_dtypes is a pre-1.0 package (major_on_zero = false) and follows
# conventional semver: feat → MINOR, fix/perf/refactor → PATCH. On 0.x this means
# a new feature bumps 0.x.y → 0.(x+1).0 and a fix bumps the patch. (An earlier
# config mapped feat → patch to "reserve" the minor for the Universal version;
# that flattened features and fixes into indistinguishable patch bumps — e.g. the
# whole posit family shipped as 0.1.4 instead of 0.2.0 — so it was dropped.)
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
major_on_zero = false
# MUST stay true. With allow_zero_version=false, semantic-release "escapes" 0.x
# by force-bumping to 1.0.0 on the first run — even for non-release commits —
# which is what accidentally published 1.0.0. Keeping it true holds the package
# on 0.x until a deliberate major bump.
allow_zero_version = true
branch = "main"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.publish]
# The dedicated publish-pypi job in wheels.yml uploads (Trusted Publishing);
# semantic-release is not the publisher.
upload_to_pypi = false
